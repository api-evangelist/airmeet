aid: airmeet
name: Airmeet
description: >-
  Airmeet is a virtual, hybrid and in-person events platform used to run webinars,
  conferences, summits, meetups, workshops and trade shows with interactive stages,
  networking lounges, booths, polls, Q&A and engagement analytics. Its Public API
  lets developers create and manage events (Airmeets), sessions, speakers, booths
  and event series; manage registrations (add, block and unblock attendees with
  custom fields); pull engagement and attendance data including polls, questions,
  UTMs, recordings and replay attendance; and subscribe to 24+ webhook event
  triggers. Authentication is a two-step flow: exchange an access key and secret
  key for a 30-day access token, then send it as the X-Airmeet-Access-Token header.
  The API is served from regional gateways (default Mumbai, EU and US). Airmeet is
  backed by Accel, Prosus Ventures and Redpoint Ventures.
